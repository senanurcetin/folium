name: Verify Folium PR 2306
on:
  push:
    branches:
      - verify/2306-wms-20261021
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install folium and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Run focused regression suite
        run: python -m pytest -q tests/test_raster_layers.py --disable-warnings --maxfail=1
      - name: Lint affected Python files
        if: always()
        run: python -m ruff check tests/test_raster_layers.py

name: Verify Folium 2311 broad core tests
on:
  push:
    branches:
      - verify/2311-core-suite-20261021
permissions:
  contents: read
jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Folium and core-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pandas geopandas pytest ruff
      - name: Run core regression suites
        run: >
          python -m pytest -q tests/test_features.py tests/test_map.py
          tests/test_utilities.py tests/test_vector_layers.py
          tests/test_raster_layers.py tests/test_folium.py
          --disable-warnings --maxfail=1
      - name: Lint changed source and tests
        if: always()
        run: python -m ruff check folium/features.py tests/test_features.py
